services:
  db:
    image: postgres:16-alpine
    container_name: kisanq-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: kisanq
      POSTGRES_DB: kisanq
      TZ: Asia/Kolkata
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d kisanq"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: kisanq-redis
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
